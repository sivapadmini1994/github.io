body {

    background: #f5f7fb;
    color: #222;
    line-height: 1.6;

header {
    background: #182848;
    color: white;

    padding: 70px 20px;

header h1 {
    font-size: 42px;

}

.projects {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));

}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.card h3 {

    border-radius: 8px;

footer {
    background: #182848;
    color: white;
    text-align: center;
    padding: 20px;
}
